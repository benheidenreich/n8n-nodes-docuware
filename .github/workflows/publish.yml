name: Publish to npm

# Publishes the package to npm with a provenance statement whenever a GitHub
# Release is published. n8n requires verified community nodes to be published
# via GitHub Actions with provenance (mandatory since 2026-05-01).
#
# --- First publish (package does not exist on npm yet) ---
# npm "Trusted Publishing" (tokenless OIDC) can only be configured on a package
# that ALREADY exists. So the very first release is published with an npm token
# stored as the GitHub secret NPM_TOKEN. --provenance still produces a full
# provenance attestation because we run on GitHub Actions with id-token: write.
#
# --- After the first publish (optional, recommended by n8n) ---
# Configure a Trusted Publisher on npmjs.com:
#   npmjs.com -> package "@benheidenreich/n8n-nodes-docuware" -> Settings -> Trusted Publisher
#   -> GitHub Actions, repo = benheidenreich/n8n-nodes-docuware, workflow = publish.yml
# Then you may delete the NPM_TOKEN secret and remove the `env:` block below;
# publishing becomes fully tokenless.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # >= 22.14 needed for OIDC trusted publishing later
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      # npm >= 11.5.1 for provenance / trusted publishing
      - run: npm install -g npm@latest

      - name: Publish (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
